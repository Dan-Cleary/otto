<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 1024x1024 marketplace app icon (Zoom etc.). Square, centered
       otter on paper background. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1024px; height: 1024px; overflow: hidden;
      background: #ece4d3;
      display: flex; align-items: center; justify-content: center;
    }
    img {
      image-rendering: pixelated;
      /* 24×24 grid sprite scaled to 768px (32px per grid pixel). */
      width: 768px; height: 768px;
    }
  </style>
</head>
<body>
  <img src="/otto/sprites/otter-idle.svg" alt="otto" />
</body>
</html>
