<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 780px; overflow: hidden; }
    body {
      background: #ece4d3;
      background-image: linear-gradient(rgba(28,26,22,0) 50%, rgba(28,26,22,0.025) 50%);
      background-size: 100% 4px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      color: #1c1a16;
      padding: 80px 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top { display: flex; align-items: center; gap: 24px; }
    .top img { image-rendering: pixelated; width: 80px; height: 80px; }
    .wordmark { font-family: "VT323", monospace; font-size: 60px; line-height: 1; letter-spacing: 0.04em; }
    .badge { background: #1c1a16; color: #f6efde; font-family: "VT323", monospace; font-size: 22px; padding: 2px 10px 0; letter-spacing: 0.05em; }
    h1 { font-family: "VT323", monospace; font-size: 110px; line-height: 0.95; }
    h1 em { font-style: italic; color: #a87528; }
    .meta { display: flex; justify-content: space-between; align-items: flex-end; }
    .tagline { font-size: 18px; letter-spacing: 0.18em; text-transform: uppercase; color: #6b6356; line-height: 1.7; max-width: 460px; }
    .tagline strong { color: #1c1a16; font-weight: 500; }
    .domain { font-family: "VT323", monospace; font-size: 32px; color: #a87528; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="top">
    <img src="/otto/sprites/otter-idle.svg" alt="otto" />
    <span class="wordmark">otto</span>
    <span class="badge">v0.4</span>
  </div>
  <h1>otto joins your<br/>meetings.<br/><em>otto ships it.</em></h1>
  <div class="meta">
    <div class="tagline">
      <strong>your engineering agent.</strong><br/>
      meeting ends, draft pr lands minutes later.<br/>
      never auto-merges, never joins your calls.
    </div>
    <div class="domain">ottoagent.app</div>
  </div>
</body>
</html>
