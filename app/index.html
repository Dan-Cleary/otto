<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>otto — offline</title>
  <meta name="description" content="otto is offline." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://ottoagent.app/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/app-icon.png" />
  <meta name="theme-color" content="#ece4d3" />
  <meta property="og:site_name" content="otto" />
  <meta property="og:title" content="otto — offline" />
  <meta property="og:description" content="otto is offline." />
  <meta property="og:url" content="https://ottoagent.app/" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=VT323&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg:      #ece4d3;
      --cream:   #f6efde;
      --hair:    #b8ad94;
      --ink:     #1c1a16;
      --pencil:  #6b6356;
      --amber:   #a87528;
      --display: "VT323", monospace;
      --mono:    "JetBrains Mono", ui-monospace, monospace;
      --eyebrow: 0.18em;
      --scan:    linear-gradient(rgba(28,26,22,0) 50%, rgba(28,26,22,0.025) 50%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--mono);
      color: var(--ink);
      background: var(--bg);
      background-image: var(--scan);
      background-size: 100% 3px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px 32px 32px;
      background: var(--cream);
      border: 1px solid var(--hair);
      box-shadow: 6px 6px 0 var(--hair);
      text-align: center;
    }
    .lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .lockup .name {
      font-family: var(--display);
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--pencil);
      letter-spacing: var(--eyebrow);
      text-transform: uppercase;
      margin: 0 0 14px;
    }
    h1 {
      font-family: var(--display);
      font-size: 64px;
      line-height: 0.95;
      margin: 0 0 18px;
    }
    p {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink);
      margin: 0 auto 12px;
      max-width: 380px;
    }
    .meta {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed var(--hair);
      font-size: 11px;
      color: var(--pencil);
      letter-spacing: var(--eyebrow);
      text-transform: uppercase;
    }
    img { image-rendering: pixelated; }
    @media (max-width: 480px) {
      h1 { font-size: 44px; }
      .card { padding: 28px 22px 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="lockup">
      <img src="/otto/sprites/otter-idle.svg" width="36" height="36" alt="otto" />
      <span class="name">otto</span>
    </span>
    <p class="eyebrow">status // 503</p>
    <h1>otto is offline.</h1>
    <p>the service has been taken offline and is not accepting new signups or feedback.</p>
    <p class="meta">no longer accepting traffic</p>
  </main>
</body>
</html>
